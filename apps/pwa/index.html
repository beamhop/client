<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>beamhop</title>
    <meta name="description" content="Control panel for your AI agents." />
    <meta name="theme-color" content="#f8f5f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#110e0b" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Draw under the status bar in both themes; the top bars pad by env(safe-area-inset-top). -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="beamhop" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- Sets data-theme / data-contrast / data-motion before first paint. External file: the daemon's CSP forbids inline scripts. -->
    <script src="/boot.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>beamhop needs JavaScript to control your agents.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
