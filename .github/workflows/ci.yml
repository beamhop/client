name: ci
on:
  push:
    branches: [main, "claude/**"]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Linux sandbox prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap socat ripgrep
          # Ubuntu 24.04 restricts unprivileged user namespaces; bubblewrap needs them.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: macOS prerequisites
        if: runner.os == 'macOS'
        run: brew install ripgrep
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-no-secrets.mjs
      - run: node scripts/version.mjs check
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run test
  pwa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @beamhop/pwa run build
      - run: pnpm --filter @beamhop/pwa exec playwright install --with-deps chromium
      - run: pnpm --filter @beamhop/pwa run test:e2e
  desktop:
    # The desktop app stages and packages (unsigned, unpacked) on each OS.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @beamhop/desktop run dist:dir
  package:
    # The npm bundle and the standalone binary build, smoke-tested the way users install them.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap socat ripgrep
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter beamhop run build
      - run: pnpm --filter beamhop run smoke
      - run: node apps/cli/scripts/sea.mjs --no-archive
      - run: dist/standalone/beamhop-*-linux-x64/beamhop --version
